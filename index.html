<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   viewport-fit=cover">

    <meta name="theme-color" content="#050508">

    <meta name="description"
          content="A little world created for Trinetra.">

    <title>Our Little World</title>

    <!-- Main Styles -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <!-- =========================================
         OPENING EXPERIENCE
    ========================================== -->

    <main id="app">

        <!-- Cinematic Intro -->
        <section id="intro" class="screen">

            <div id="stars"></div>

            <div class="intro-content">

                <p class="date" id="date">
                    12.08.2026
                </p>

                <div class="intro-line"></div>

                <h1 id="intro-title">
                    Some dates are just dates.
                </h1>

                <p id="intro-subtitle">
                    Some become memories.
                </p>

            </div>

        </section>


        <!-- =====================================
             MAIN WORLD
        ====================================== -->

        <section id="world" class="screen hidden">

            <div class="world-content">

                <p class="eyebrow">
                    WELCOME TO
                </p>

                <h1>
                    Trinetra
                </h1>

                <p class="world-description">
                    A little world created just for you.
                </p>

                <button id="enter-world">
                    Enter Our Little World
                </button>

            </div>

        </section>

    </main>


    <!-- JavaScript -->

    <script src="js/app.js"></script>
    <script src="js/universe.js"></script>

</body>
</html>
