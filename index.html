<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#030305">

    <meta
        name="description"
        content="A little world created for Trinetra."
    >

    <title>Our Little World</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link rel="manifest" href="manifest.json">
</head>

<body>

<main id="app">

    <!-- =====================================
         STAR FIELD
    ====================================== -->

    <div id="stars"></div>


    <!-- =====================================
         V2 CINEMATIC INTRO
    ====================================== -->

    <section id="intro" class="screen">

        <div class="intro-content">

            <p class="date" id="date">
                12.08.2026
            </p>

            <div class="intro-line"></div>

            <h1 id="intro-title">
                Some dates are just dates.
            </h1>

            <p id="intro-subtitle">
                Some become memories.
            </p>

        </div>

    </section>


    <!-- =====================================
         TRINETRA REVEAL
    ====================================== -->

    <section id="reveal" class="screen hidden">

        <div class="reveal-content">

            <p class="reveal-small">
                AND THEN THERE WAS
            </p>

            <h1 class="trinetra">
                Trinetra
            </h1>

            <p class="reveal-message">
                I made something for you.
            </p>

            <div class="reveal-line"></div>

            <h2>
                Our Little World
            </h2>

            <button id="enter-world">
                ENTER
            </button>

        </div>

    </section>


    <!-- =====================================
         MAIN WORLD
    ====================================== -->

    <section id="world" class="screen hidden">

        <div class="world-content">

            <p class="eyebrow">
                WELCOME TO
            </p>

            <h1>
                Our Little World
            </h1>

            <p class="world-description">
                A universe made from memories, moments and everything in between.
            </p>

        </div>

    </section>

</main>


<script src="js/universe.js"></script>
<script src="js/app.js"></script>

</body>
</html>
